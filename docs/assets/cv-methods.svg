<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="320" viewBox="0 0 1100 320" role="img"
     aria-label="Computer vision methods: YOLOv8n, MobileNetV3 and ResNet-50, OCR deposit mark">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1F33"/>
      <stop offset="100%" stop-color="#0F2740"/>
    </linearGradient>
  </defs>
  <rect width="1100" height="320" rx="16" fill="url(#bg2)"/>
  <text x="550" y="40" text-anchor="middle" font-family="Helvetica, Arial, DejaVu Sans, sans-serif"
        font-size="16" font-weight="600" fill="#94A3B8" letter-spacing="2">COMPUTER VISION METHODS</text>

  <!-- Card 1 YOLO -->
  <rect x="40" y="70" width="320" height="210" rx="14" fill="#102A43" stroke="#1E3A5F" stroke-width="1.5"/>
  <rect x="40" y="70" width="320" height="8" rx="4" fill="#0D9488"/>
  <!-- bounding box icon -->
  <g transform="translate(160,100)" fill="none" stroke="#5EEAD4" stroke-width="2.5">
    <rect x="0" y="8" width="80" height="56" rx="4" stroke-dasharray="6 4"/>
    <rect x="16" y="20" width="48" height="32" rx="3" stroke="#14B8A6" stroke-dasharray="0"/>
    <circle cx="16" cy="20" r="3" fill="#14B8A6" stroke="none"/>
    <circle cx="64" cy="20" r="3" fill="#14B8A6" stroke="none"/>
    <circle cx="16" cy="52" r="3" fill="#14B8A6" stroke="none"/>
    <circle cx="64" cy="52" r="3" fill="#14B8A6" stroke="none"/>
  </g>
  <text x="200" y="190" text-anchor="middle" font-family="Helvetica, Arial, DejaVu Sans, sans-serif"
        font-size="20" font-weight="700" fill="#F8FAFC">YOLOv8n detection</text>
  <text x="200" y="218" text-anchor="middle" font-family="Helvetica, Arial, DejaVu Sans, sans-serif"
        font-size="13" fill="#94A3B8">Ultralytics · chute object box</text>
  <text x="200" y="242" text-anchor="middle" font-family="Helvetica, Arial, DejaVu Sans, sans-serif"
        font-size="12" fill="#5EEAD4">YOLO11n drop-in alternative</text>

  <!-- Card 2 Transfer learning -->
  <rect x="390" y="70" width="320" height="210" rx="14" fill="#102A43" stroke="#1E3A5F" stroke-width="1.5"/>
  <rect x="390" y="70" width="320" height="8" rx="4" fill="#14B8A6"/>
  <!-- layers icon -->
  <g transform="translate(510,102)" fill="none" stroke="#5EEAD4" stroke-width="2.5" stroke-linecap="round">
    <rect x="10" y="0" width="80" height="16" rx="3" fill="#134E4A" stroke="#14B8A6"/>
    <rect x="20" y="22" width="60" height="16" rx="3" fill="#0F766E" stroke="#14B8A6"/>
    <rect x="30" y="44" width="40" height="16" rx="3" fill="#0D9488" stroke="#5EEAD4"/>
    <path d="M50 60 V72" stroke="#94A3B8"/>
  </g>
  <text x="550" y="198" text-anchor="middle" font-family="Helvetica, Arial, DejaVu Sans, sans-serif"
        font-size="18" font-weight="700" fill="#F8FAFC">MobileNetV3 / ResNet-50</text>
  <text x="550" y="224" text-anchor="middle" font-family="Helvetica, Arial, DejaVu Sans, sans-serif"
        font-size="13" fill="#94A3B8">Transfer learning · freeze then finetune</text>
  <text x="550" y="248" text-anchor="middle" font-family="Helvetica, Arial, DejaVu Sans, sans-serif"
        font-size="12" fill="#5EEAD4">Category + confidence</text>

  <!-- Card 3 OCR -->
  <rect x="740" y="70" width="320" height="210" rx="14" fill="#102A43" stroke="#1E3A5F" stroke-width="1.5"/>
  <rect x="740" y="70" width="320" height="8" rx="4" fill="#22C55E"/>
  <!-- OCR text icon -->
  <g transform="translate(860,100)" fill="none" stroke="#86EFAC" stroke-width="2.5" stroke-linecap="round">
    <rect x="0" y="4" width="80" height="60" rx="6" stroke="#22C55E"/>
    <path d="M14 22 H66 M14 36 H54 M14 50 H42" stroke="#BBF7D0" stroke-width="3"/>
    <rect x="48" y="44" width="22" height="12" rx="2" fill="#14532D" stroke="#86EFAC"/>
  </g>
  <text x="900" y="190" text-anchor="middle" font-family="Helvetica, Arial, DejaVu Sans, sans-serif"
        font-size="20" font-weight="700" fill="#F8FAFC">OCR / deposit mark</text>
  <text x="900" y="218" text-anchor="middle" font-family="Helvetica, Arial, DejaVu Sans, sans-serif"
        font-size="13" fill="#94A3B8">EasyOCR · barcode · deposit logo</text>
  <text x="900" y="242" text-anchor="middle" font-family="Helvetica, Arial, DejaVu Sans, sans-serif"
        font-size="12" fill="#86EFAC">Optional · graceful fallback</text>
</svg>
