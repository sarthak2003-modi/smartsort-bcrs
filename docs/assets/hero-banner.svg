<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img"
     aria-label="SmartSort — AI vision + sensor fusion for fraud-proof BCRS returns">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#071521"/>
      <stop offset="55%" stop-color="#0B1F33"/>
      <stop offset="100%" stop-color="#0F3D3A"/>
    </linearGradient>
    <linearGradient id="beam" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#14B8A6" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#14B8A6" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#14B8A6" stop-opacity="0"/>
      <stop offset="50%" stop-color="#14B8A6" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#14B8A6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bottle" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E0F2FE" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#7DD3FC" stop-opacity="0.45"/>
    </linearGradient>
    <linearGradient id="can" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#CBD5E1"/>
      <stop offset="50%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="400" fill="url(#bg)"/>
  <!-- circuit accents left -->
  <g stroke="#134E4A" stroke-width="1.5" fill="none" opacity="0.7">
    <path d="M40 80 H120 V140 H180"/>
    <circle cx="120" cy="80" r="3" fill="#14B8A6" stroke="none"/>
    <circle cx="180" cy="140" r="3" fill="#14B8A6" stroke="none"/>
    <path d="M60 220 H100 V280 H160"/>
    <circle cx="100" cy="220" r="3" fill="#0D9488" stroke="none"/>
    <path d="M200 300 H260 V340"/>
    <circle cx="260" cy="340" r="3" fill="#14B8A6" stroke="none"/>
  </g>
  <rect x="0" y="40" width="6" height="320" fill="url(#edge)" rx="3"/>

  <!-- chute housing right -->
  <g transform="translate(780,70)">
    <rect x="0" y="40" width="420" height="240" rx="18" fill="#0F2740" stroke="#1E3A5F" stroke-width="2"/>
    <!-- chute opening -->
    <path d="M40 80 L380 80 L350 220 L70 220 Z" fill="#071521" stroke="#14B8A6" stroke-width="2"/>
    <!-- scan beam -->
    <polygon points="210,20 140,200 280,200" fill="url(#beam)"/>
    <!-- scan lines -->
    <g stroke="#5EEAD4" stroke-width="1" opacity="0.5">
      <line x1="155" y1="120" x2="265" y2="120"/>
      <line x1="150" y1="145" x2="270" y2="145"/>
      <line x1="148" y1="170" x2="272" y2="170"/>
    </g>
    <!-- camera -->
    <g transform="translate(178,0)">
      <rect x="0" y="0" width="64" height="40" rx="8" fill="#134E4A" stroke="#14B8A6" stroke-width="2"/>
      <circle cx="32" cy="20" r="12" fill="#071521" stroke="#5EEAD4" stroke-width="2"/>
      <circle cx="32" cy="20" r="5" fill="#14B8A6"/>
    </g>
    <!-- bottle -->
    <g transform="translate(150,110)">
      <rect x="18" y="8" width="24" height="14" rx="3" fill="#94A3B8"/>
      <path d="M10 22 H50 L46 100 H14 Z" fill="url(#bottle)" stroke="#7DD3FC" stroke-width="1.5"/>
      <ellipse cx="30" cy="22" rx="20" ry="5" fill="#BAE6FD" opacity="0.6"/>
    </g>
    <!-- can -->
    <g transform="translate(250,130)">
      <rect x="0" y="8" width="44" height="70" rx="8" fill="url(#can)" stroke="#E2E8F0" stroke-width="1.5"/>
      <ellipse cx="22" cy="8" rx="22" ry="7" fill="#F8FAFC"/>
      <ellipse cx="22" cy="78" rx="22" ry="6" fill="#64748B"/>
      <rect x="6" y="30" width="32" height="18" rx="3" fill="#0D9488" opacity="0.7"/>
    </g>
    <!-- label -->
    <text x="210" y="255" text-anchor="middle" font-family="Helvetica, Arial, DejaVu Sans, sans-serif"
          font-size="12" fill="#5EEAD4" font-weight="600">CHUTE · CAM + SCAN</text>
  </g>

  <!-- Title -->
  <text x="56" y="150" font-family="Helvetica, Arial, DejaVu Sans, sans-serif"
        font-size="64" font-weight="700" fill="#F8FAFC" letter-spacing="-1.2">SmartSort</text>
  <text x="56" y="198" font-family="Helvetica, Arial, DejaVu Sans, sans-serif"
        font-size="22" font-weight="400" fill="#99F6E4">AI vision + sensor fusion for fraud-proof BCRS returns</text>
  <text x="56" y="250" font-family="Helvetica, Arial, DejaVu Sans, sans-serif"
        font-size="14" fill="#CBD5E1">Singapore Beverage Container Return Scheme · NTU AI Literacy</text>
  <g font-family="Helvetica, Arial, DejaVu Sans, sans-serif" font-size="13" font-weight="600">
    <rect x="56" y="278" width="118" height="32" rx="16" fill="#0D9488"/>
    <text x="115" y="299" text-anchor="middle" fill="#ECFDF5">YOLOv8n</text>
    <rect x="186" y="278" width="150" height="32" rx="16" fill="#134E4A"/>
    <text x="261" y="299" text-anchor="middle" fill="#99F6E4">Sensor fusion</text>
    <rect x="348" y="278" width="110" height="32" rx="16" fill="#14532D"/>
    <text x="403" y="299" text-anchor="middle" fill="#BBF7D0">PAY 10¢</text>
  </g>
</svg>
